name: refresh
on:
  schedule:
    - cron: "30 4 * * *"   # daily 10:00 IST; GJEPC publishes monthly (around the 7th-15th), so a daily check catches it within a day
  workflow_dispatch:
  push:
    paths: ["inbox/**.pdf"]
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install --quiet numpy
      - name: Fetch public data
        run: python3 scripts/fetch.py
      - name: Model, ledger, scoring
        run: python3 scripts/model.py
      - name: Unit tests
        run: python3 -m unittest discover -s test -p "test_*.py" -v
      - name: Commit data
        run: |
          git config user.name "lgd-bot"
          git config user.email "lgd-bot@users.noreply.github.com"
          git pull --rebase -q || true
          git add data
          git diff --cached --quiet || (git commit -m "data refresh $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')" && git push)
